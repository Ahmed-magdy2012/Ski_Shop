

<header class=" fixed top-0 z-50 mb-0 max-h-20 w-full bg-white p-3 shadow-lg">
    <div class="mx-auto flex max-w-screen-2xl items-center justify-between">
        <img routerLink="/" src="/images/logo.png " class="max-h-16" alt="app logo" />
        <nav class=" flex gap-3 text-xl uppercase">
            <a routerLink="/" routerLinkActive="active"
               [routerLinkActiveOptions]="{exact:true}">Home</a>
            <a routerLink="/shop" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">shop</a>
            <a routerLink="/test-error" routerLinkActive="active">Errors</a>

        </nav>
        <div class="flex gap-3">
            <a routerLink="/cart" matBadge="5" matBadgeSize="large">
                <mat-icon>shopping_cart</mat-icon>

            </a>
            <button mat-stroked-button>Login</button>
            <button mat-stroked-button>Register</button>

        </div>
      
    
    </div>

</header>   

@if(busyService.loading){
<mat-progress-bar mode="indeterminate" class="fixed top-14"></mat-progress-bar>
}
