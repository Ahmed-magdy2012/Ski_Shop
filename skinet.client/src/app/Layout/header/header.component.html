

<header class=" w-full p-3 shadow-lg">
    <div class="mx-auto flex max-w-screen-2xl items-center justify-between">
        <img routerLink="/" src="/images/logo.png " class="max-h-16" alt="app logo" />
        <nav class=" flex gap-3 text-xl uppercase">
            <a routerLink="/" routerLinkActive="active"
               [routerLinkActiveOptions]="{exact:true}">Home</a>
            <a routerLink="/shop" routerLinkActive="active">shop</a>
            <a routerLink="/shop/2" routerLinkActive="active">contact</a>

        </nav>
        <div class="flex gap-3">
            <a matBadge="5" matBadgeSize="large">
                <mat-icon>shopping_cart</mat-icon>

            </a>
            <button mat-stroked-button>Login</button>
            <button mat-stroked-button>Register</button>

        </div>
      
    
    </div>

</header>
