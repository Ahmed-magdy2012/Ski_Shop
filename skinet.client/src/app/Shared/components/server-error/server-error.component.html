<div class="container mt-2 rounded bg-gray-100 p-4 shadow-lg">
    <h1 class="mb-4 text-3xl font-semibold">Internel server Error</h1>
    @if(error){
        <h5 class="text-red-300">
            Error :  {{error.message}}
        </h5>
        <p class="mb-2 font-bold">This error comes from the server,not Angular</p>
        <p class="mb-2">
            What to do next ?
        </p>
        <ol class="mb-4 ml-5 list-decimal">
            <li>Check the network tab in chrome dev tools</li>
            <li>Reproduce the error in postman </li>
        </ol>
        <h5 class="mb-2 font-semibold">Stack Trace</h5>
        <mat-card class="bg-white p-4">
            <code class="block whitespace-pre-wrap">{{error.Details}}</code>
        </mat-card>
    }
</div>
