<div class="container mx-auto mt-32 flex gap-4">
<div class="w-3/4 text-start">
    <mat-stepper
    [linear]="true"
    (selectionChange)="onstepchange($event)"
    #stepper class="border border-gray-300 shadow-sm">
        <mat-step label="Adress" [completed]="completionStatus().address">
            <div id="address-element"> </div>

            <div class="mt-2 flex justify-end">
                <mat-checkbox [checked]="saveAddress"
                              (change)="onSave($event)">
                    Save as default address
                </mat-checkbox>
            </div>
            <div class="mt-6 flex justify-between">
                <button class="z-0" routerLink="/shop " mat-stroked-button>Continue shopping</button>
                <button [disabled]="!completionStatus().address" class="z-0" matStepperNext mat-flat-button>Next</button>
                 
            </div>
        </mat-step>
        <mat-step label="Shipping" [completed]="completionStatus().delivery">
            <app-checkout-delivery (deliveryComplete)="handleDelivery($event)"></app-checkout-delivery>
            <div class="mt-6 flex justify-between">
                <button matStepperPrevious routerLink="/shop " mat-stroked-button>Back</button>
                <button [disabled] ="!completionStatus().delivery" matStepperNext mat-flat-button>Next</button>

</div>
        </mat-step><mat-step label="Payment">
    <div id="payment-element">
    </div>
    <div class="mt-6 flex justify-between">
        <button matStepperPrevious routerLink="/shop " mat-stroked-button>Back</button>
        <button [disabled]="!completionStatus().card" matStepperNext mat-flat-button>Next</button>

    </div>
</mat-step>
                   <mat-step label="Confirmation">
                       <app-checkout-review [confirmation]="confirmationToken"></app-checkout-review>
                       <div class="mt-6 flex justify-between">
                           <button matStepperPrevious routerLink="/shop " mat-stroked-button>Back</button>
                           <button
                           [disabled]="!confirmationToken|| loading"
                           (click)="confirmPayment(stepper)"
                           mat-flat-button>
                           @if(loading){
                               <mat-spinner diameter="20"></mat-spinner>
                           }
@else{
                               <span>
                                   Pay {{cartservice.Totals()?.total | currency}}
                               </span>
}
</button>
                       </div>
                   </mat-step>
    </mat-stepper>
    <pre>{{completionStatus() | json}}</pre>

 </div>
<div class="w-1/4">
    <app-ordar-summary></app-ordar-summary>

</div>
</div>
