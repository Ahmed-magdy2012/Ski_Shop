@if(products)

{

<div class="flex flex-col gap-3 pt-3">
    <div class="flex justify-between">

        <mat-paginator (page)="handelpageEvent($event)"
                       [length]="products.count"
                       [pageSize]="shopparams.pageSize"
                       [showFirstLastButtons]="true"
                       [pageSizeOptions]="pageSizeOptions"
                       [pageIndex]="shopparams.pageIndex-1"
                       aria-label="Select page">
        </mat-paginator>

        <form #searchForm="ngForm"
              (ngSubmit)="onSearchchange()"
              class="relative mx-4 flex w-full max-w-md items-center">
            <input type="search" class="block w-full rounded-lg border border-gray-300 p-4 text-sm text-gray-900"
                   placeholder="Search"
                   name="search"
                   [(ngModel)]="shopparams.search" />
            <button mat-icon-button type="submit" class="absolute right-8 flex items-center pl-3">
                <mat-icon>search</mat-icon>
            </button>
        </form>

        <div class="flex gap-3">
            <button class="match-input-height" mat-stroked-button (click)="openDialog()">
                <mat-icon> filter_list</mat-icon>
                Filters
            </button>
            <button class="match-input-height" mat-stroked-button [matMenuTriggerFor]="sortMenu">
                <mat-icon> swap_vert</mat-icon>
                Sort
            </button>


        </div>


    </div>

    <div class="grid grid-cols-5 gap-4">
        @for(product of products.data;track product.id){
        <app-product-item [product]="product"></app-product-item>
        }

    </div>

</div>

<mat-menu #sortMenu="matMenu">
    <mat-selection-list [multiple]="false" (selectionChange)="onSortChange($event)">
        @for(sort of sortOptions;track $index)   {
        <mat-list-option [value]="sort.value" [selected]="shopparams.sort===sort.value">{{sort.name}}</mat-list-option>
        }
    </mat-selection-list>
</mat-menu>




}
